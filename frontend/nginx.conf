server {
  listen 80;
  server_name abakosoft.online www.abakosoft.online;

  # Compresión gzip para JS/CSS/JSON (reduce bundle ~70%)
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml+rss
    image/svg+xml;

  # Assets con hash en el nombre: caché 1 año (inmutable)
  location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # SPA: rutas de React
  # index.html SIEMPRE se revalida (no-cache) para que el navegador
  # tome el bundle nuevo con hash; los assets con hash ya tienen caché 1 año.
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # API va al backend (sin trailing slash: conserva el prefijo /api/)
  location /api/ {
    proxy_pass http://backend:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

